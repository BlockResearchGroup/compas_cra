name: release

# A release is the same pipeline every push runs, plus publishing. See pipeline.yml.
#
# On PyPI, compas_cra needs a trusted publisher for this repository with `release.yml`
# as the workflow and `pypi` as the environment. The publish job itself lives in the
# reusable pipeline, but PyPI matches the calling workflow - this file. (Verified
# against compas_sandbox's own PyPI provenance, which has the same layout.)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  pipeline:
    uses: ./.github/workflows/pipeline.yml
    with:
      publish: true
    permissions:
      id-token: write  # trusted publishing
      contents: write  # gh-pages + GitHub release
