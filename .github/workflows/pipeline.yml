name: pipeline

# The single build pipeline, called by build.yml (every push) and by release.yml
# (v* tags). Always the full chain: IPOPT compiled from source, a compas_cra wheel
# for every platform and CPython with the solver built into it, each smoke-tested,
# the full test suite run against one of those wheels, and the docs built.
# Everything it produces is left as run artifacts: `wheels-*`, `sdist` and
# `docs-site`.
#
# It deliberately publishes nothing. PyPI's trusted publishing refuses tokens minted
# inside a reusable workflow (pypi/warehouse#11096), so the publish jobs live in
# release.yml, which is not reusable, and consume these artifacts.

on:
  workflow_call:

# The cibuildwheel settings live in pyproject.toml ([tool.cibuildwheel]); only what
# depends on the runner is set here.
env:
  IPOPT_VERSION: "3.14.19"

jobs:
  wheels-linux:
    name: wheels-${{ matrix.tag }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
            tag: manylinux_2_28_x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
            tag: manylinux_2_28_aarch64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheels
        env:
          CIBW_ARCHS_LINUX: ${{ matrix.arch }}
        run: |
          python -m pip install -q cibuildwheel
          python -m cibuildwheel --output-dir dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.tag }}
          path: dist/*.whl

  wheels-macos:
    name: wheels-${{ matrix.tag }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            tag: macosx_arm64
            deployment_target: "14.0"
          - os: macos-15-intel
            tag: macosx_x86_64
            deployment_target: "15.0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: |
          brew list bash >/dev/null 2>&1 || brew install bash
          brew list gcc >/dev/null 2>&1 || brew install gcc
          test -x "$(brew --prefix)/bin/gfortran" || \
            ln -sf "$(ls "$(brew --prefix)"/bin/gfortran-* | tail -1)" "$(brew --prefix)/bin/gfortran"
      - name: Cache ipopt build
        id: cache-ipopt
        uses: actions/cache@v4
        with:
          path: build/ipopt/stage
          key: ipopt-stage-${{ env.IPOPT_VERSION }}-${{ matrix.tag }}-${{ hashFiles('packaging/build_ipopt.sh') }}
      - name: Build ipopt
        if: steps.cache-ipopt.outputs.cache-hit != 'true'
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: packaging/build_ipopt.sh
      - name: Build wheels
        env:
          CIBW_ENVIRONMENT: >-
            IPOPT_PREFIX=${{ github.workspace }}/build/ipopt/stage
            MACOSX_DEPLOYMENT_TARGET=${{ matrix.deployment_target }}
        run: |
          python -m pip install -q cibuildwheel
          python -m cibuildwheel --output-dir dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.tag }}
          path: dist/*.whl

  wheels-windows:
    name: wheels-win_amd64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          location: D:\
          install: >-
            git
            patch
            make
            diffutils
            pkgconf
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-gcc-fortran
            mingw-w64-ucrt-x86_64-openblas
      - name: Cache ipopt build
        id: cache-ipopt
        uses: actions/cache@v4
        with:
          path: build/ipopt/stage
          key: ipopt-stage-${{ env.IPOPT_VERSION }}-win_amd64-${{ hashFiles('packaging/build_ipopt.sh') }}
      - name: Build ipopt
        if: steps.cache-ipopt.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: packaging/build_ipopt.sh
      - name: Build wheels
        shell: bash
        env:
          CIBW_ARCHS_WINDOWS: AMD64
          CIBW_ENVIRONMENT: >-
            IPOPT_PREFIX='${{ github.workspace }}\build\ipopt\stage'
            EXTRA_LINK_DIRS='D:\msys64\ucrt64\lib'
            CMAKE_GENERATOR=Ninja
            CMAKE_ARGS='-DCMAKE_C_COMPILER=D:/msys64/ucrt64/bin/gcc.exe -DCMAKE_CXX_COMPILER=D:/msys64/ucrt64/bin/g++.exe -DFORTRAN_COMPILER=D:/msys64/ucrt64/bin/gfortran.exe'
        run: |
          python -m pip install -q cibuildwheel
          python -m cibuildwheel --output-dir dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-win_amd64
          path: dist/*.whl

  sdist:
    name: sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # source only; building it needs a staged IPOPT tree (packaging/build_ipopt.sh)
      - run: pipx run build --sdist --outdir dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  test:
    name: test the built wheel
    needs: wheels-linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: wheels-manylinux_2_28_x86_64
          path: wheelhouse
      # from /tmp, so the tests run against the installed package, not the checkout
      - name: Run the test suite against the wheel
        run: |
          python -m venv venv-test
          venv-test/bin/pip install -q wheelhouse/compas_cra-*-cp312-*.whl pytest
          cd /tmp && "$GITHUB_WORKSPACE/venv-test/bin/python" -m pytest "$GITHUB_WORKSPACE/tests" -v

  docs:
    name: docs
    needs: wheels-linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: wheels-manylinux_2_28_x86_64
          path: wheelhouse
      # the wheel from this very run, never PyPI: the docs build can then never
      # depend on PyPI propagation state, and never rebuilds the extension
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libegl1 libgl1
          python -m pip install -q --upgrade pip
          python -m pip install -q "$(ls wheelhouse/compas_cra-*-cp312-*.whl)[dev]"
      - name: Build docs
        run: |
          invoke docs
          test -f dist/docs/index.html
      - uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: dist/docs
