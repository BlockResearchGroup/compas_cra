name: build

on:
  push:
    branches:
      - main
      - pypi
  pull_request:
    branches:
      - main
      - pypi

jobs:
  lint:
    if: "!contains(github.event.pull_request.labels.*.name, 'docs-only')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: invoke lint

  # The test suite needs the ipopt executable, which is built and shipped by the
  # wheels workflow. Tests therefore run there, against the installed wheel, on all
  # five target platforms - see .github/workflows/wheels.yml.
