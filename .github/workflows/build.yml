name: build

# Every push runs the exact same pipeline as a release (IPOPT from source, all
# platform wheels, full tests) - just without publishing. A tag then releases the
# same thing via release.yml.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lint
        run: |
          python -m pip install -q ruff invoke compas_invocations2
          invoke lint

  pipeline:
    uses: ./.github/workflows/pipeline.yml
    with:
      publish: false
    # ceiling only: the publish/deploy jobs are skipped on publish: false, but a
    # called workflow may not request more permissions than the caller grants
    permissions:
      id-token: write
      contents: write
