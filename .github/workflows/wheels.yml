name: wheels

on:
  push:
    branches: [main, pypi]
    tags: ["v*"]
  pull_request:
    branches: [main, pypi]
  workflow_dispatch:

env:
  IPOPT_VERSION: "3.14.19"

jobs:
  # ---------------------------------------------------------------------------
  # One wheel per platform. There is no compiled Python extension - the wheels
  # only differ in the ipopt executable they carry - so a single py3-none-<plat>
  # wheel serves every supported Python version.
  # ---------------------------------------------------------------------------
  linux:
    name: ${{ matrix.tag }}
    runs-on: ${{ matrix.os }}
    container: quay.io/pypa/manylinux_2_28_${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
            tag: manylinux_2_28_x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
            tag: manylinux_2_28_aarch64

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          dnf install -y --enablerepo=powertools \
            glibc-static libstdc++-static openblas-static

      - name: Cache ipopt binary
        id: cache-ipopt
        uses: actions/cache@v4
        with:
          path: |
            src/compas_cra/_ipopt/bin
            src/compas_cra/_ipopt/licenses
          key: ipopt-${{ env.IPOPT_VERSION }}-${{ matrix.tag }}-${{ hashFiles('packaging/build_ipopt.sh') }}

      - name: Build ipopt
        if: steps.cache-ipopt.outputs.cache-hit != 'true'
        run: packaging/build_ipopt.sh

      - name: Audit binary
        run: packaging/check_binary.sh src/compas_cra/_ipopt/bin/ipopt

      - name: Build wheel
        run: |
          /opt/python/cp312-cp312/bin/python -m pip install -q build wheel
          PATH=/opt/python/cp312-cp312/bin:$PATH packaging/build_wheel.sh ${{ matrix.tag }}

      - name: Test wheel in a clean environment
        run: packaging/test_wheel.sh /opt/python/cp312-cp312/bin/python

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.tag }}
          path: dist/*.whl

  macos:
    name: ${{ matrix.tag }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            tag: macosx_11_0_arm64
          # macos-13 was retired; macos-15-intel is the x86_64 image
          - os: macos-15-intel
            tag: macosx_11_0_x86_64

    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          # coinbrew needs bash >= 4; macOS still ships 3.2 as /bin/bash
          brew list bash >/dev/null 2>&1 || brew install bash
          brew list gcc >/dev/null 2>&1 || brew install gcc
          # The formula installs versioned binaries only (gfortran-14, ...).
          test -x "$(brew --prefix)/bin/gfortran" || \
            ln -sf "$(ls "$(brew --prefix)"/bin/gfortran-* | tail -1)" "$(brew --prefix)/bin/gfortran"
          gfortran --version | head -1

      - name: Cache ipopt binary
        id: cache-ipopt
        uses: actions/cache@v4
        with:
          path: |
            src/compas_cra/_ipopt/bin
            src/compas_cra/_ipopt/licenses
          key: ipopt-${{ env.IPOPT_VERSION }}-${{ matrix.tag }}-${{ hashFiles('packaging/build_ipopt.sh') }}

      - name: Build ipopt
        if: steps.cache-ipopt.outputs.cache-hit != 'true'
        run: packaging/build_ipopt.sh

      - name: Audit binary
        run: packaging/check_binary.sh src/compas_cra/_ipopt/bin/ipopt

      - name: Build wheel
        run: |
          python -m pip install -q build wheel
          packaging/build_wheel.sh ${{ matrix.tag }}

      - name: Test wheel in a clean environment
        run: packaging/test_wheel.sh python

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.tag }}
          path: dist/*.whl

  windows:
    name: win_amd64
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            patch
            make
            diffutils
            pkgconf
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-gcc-fortran
            mingw-w64-ucrt-x86_64-openblas

      - name: Cache ipopt binary
        id: cache-ipopt
        uses: actions/cache@v4
        with:
          path: |
            src/compas_cra/_ipopt/bin
            src/compas_cra/_ipopt/licenses
          key: ipopt-${{ env.IPOPT_VERSION }}-win_amd64-${{ hashFiles('packaging/build_ipopt.sh') }}

      - name: Build ipopt
        if: steps.cache-ipopt.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: packaging/build_ipopt.sh

      - name: Audit binary
        shell: msys2 {0}
        run: packaging/check_binary.sh src/compas_cra/_ipopt/bin/ipopt.exe

      - name: Build wheel
        shell: bash
        run: |
          python -m pip install -q build wheel
          packaging/build_wheel.sh win_amd64

      - name: Test wheel in a clean environment
        shell: bash
        run: packaging/test_wheel.sh python

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-win_amd64
          path: dist/*.whl

  sdist:
    name: sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pipx run build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    name: publish to PyPI
    needs: [linux, macos, windows, sdist]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write  # required for trusted publishing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist
      - run: ls -lh dist

      # A green build is not enough: a renamed job or a dropped artifact would publish
      # a partial release, and a pure py3-none-any wheel would install everywhere and
      # then fail at the first solve. Neither is visible without looking inside.
      - name: Verify every platform is present and every wheel carries a solver
        run: python packaging/check_release.py dist

      - uses: pypa/gh-action-pypi-publish@release/v1
