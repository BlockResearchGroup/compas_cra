[build-system]
# The IPOPT binding is built as part of the package itself, so the build backend has to
# be able to drive CMake. nanobind 3.x dropped Python 3.9, which Rhino 8 still ships —
# stay on 2.x.
requires = ["scikit-build-core>=0.10", "nanobind>=2.2,<3"]
build-backend = "scikit_build_core.build"

# ============================================================================
# project info
# ============================================================================

[project]
name = "compas_cra"
description = ""
keywords = []
authors = [{ name = "Gene Ting-Chun Kao", email = "kao@arch.ethz.ch" }]
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.9"
dynamic = ["version"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Topic :: Scientific/Engineering",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
]

# scikit-build-core reads no requirements.txt, so the dependencies live here.
dependencies = [
    "compas>=2.4",
    "compas_assembly>=0.7.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "shapely>=2.0",
]

[project.optional-dependencies]
viz = ["compas_viewer", "matplotlib"]
dev = [
    "attrs>=17.4",
    "black>=22.12.0",
    "build",
    "bump-my-version",
    # the documentation stack too, so `pip install -e ".[dev]"` is the only install step a
    # contributor needs: `invoke docs` is unusable without it, and `docs` alone has no invoke
    "compas_cra[docs]",
    "compas_invocations2",
    "compas_viewer",
    "invoke>=0.14",
    # invoke test is unusable without it; CI happened to install it separately
    "pytest",
    "ruff",
    "twine",
    "wheel",
]
# the docs are mkdocs-material + mkdocstrings, same stack as compas_model
# mirrored by requirements.txt, which installs this stack without building the
# package - the documentation never needs the compiled solver
docs = [
    "markdown-callouts>=0.4",
    "mkdocs>=1.6,<2",  # Material is incompatible with the MkDocs 2.0 rewrite, per its own banner
    "mkdocs-autorefs>=1.4",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]",
    # mkdocs.yml configures pymdownx.* directly, so it is a direct dependency; it happens to
    # arrive with mkdocs-material today, which is not something to rely on
    "pymdown-extensions>=10",
]

[project.urls]
Homepage = "https://blockresearchgroup.github.io/compas_cra"
Documentation = "https://blockresearchgroup.github.io/compas_cra"
Repository = "https://github.com/BlockResearchGroup/compas_cra.git"
Changelog = "https://github.com/BlockResearchGroup/compas_cra/blob/main/CHANGELOG.md"

# ============================================================================
# scikit-build-core config
# ============================================================================

[tool.scikit-build]
minimum-version = "0.10"
# the pure Python half of the package; CMake installs the _native/_core extension
# alongside it (see CMakeLists.txt)
wheel.packages = ["src/compas_cra"]
# stripping would invalidate the macOS ad-hoc code signature; arm64 kills unsigned code
install.strip = false
sdist.exclude = [".github", "data/rhino-models", "docs/assets", "temp"]

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "src/compas_cra/__init__.py"

# ============================================================================
# cibuildwheel config
# ============================================================================
# Everything here is platform-independent, so `cibuildwheel` reproduces the CI
# build locally with no environment variables at all. Only the settings that
# depend on the runner (workspace paths, the macOS deployment target, the MSYS2
# install location) are left in .github/workflows/pipeline.yml.

[tool.cibuildwheel]
# cp39 is Rhino 8's CPython; nanobind 2.x is kept for exactly that reason
build = "cp39-* cp310-* cp311-* cp312-* cp313-*"
skip = ["*-musllinux_*", "*_i686", "*-win32", "pp*"]
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"
# numpy is all the smoke test needs; the wheel's own dependencies come with it
test-requires = ["numpy"]
test-command = "python {project}/native/smoke.py"

# IPOPT is compiled from source inside the manylinux container, once per
# container, before any wheel is built. On macOS and Windows the same script
# runs on the runner itself (and is cached there), because the build does not
# happen in a container.
[tool.cibuildwheel.linux]
# JOBS=1: MUMPS' makefiles are missing dependencies, so a parallel build races and
# dies linking libcoinmumps -- always just after dtype3_root.F, and coinbrew reports
# nothing but "Build failed, see error output above" with no error above it. It is
# intermittent: it failed three of six runs in compas_sandbox before being pinned
# down. The container does not inherit the workflow env, so JOBS is set here.
before-all = """\
dnf install -y --enablerepo=powertools \
    glibc-static libstdc++-static openblas-static openblas-devel && \
env JOBS=1 CFLAGS="-O2 -fPIC" CXXFLAGS="-O2 -fPIC" FFLAGS="-O2 -fPIC" FCFLAGS="-O2 -fPIC" \
    {project}/packaging/build_ipopt.sh"""
environment = { IPOPT_PREFIX = "/project/build/ipopt/stage" }

[tool.cibuildwheel.windows]
before-build = "pip install delvewheel"
# grafts the MSYS2 runtime DLLs (libgfortran, OpenBLAS, ...) into the wheel
repair-wheel-command = "delvewheel repair --add-path D:\\msys64\\ucrt64\\bin -w {dest_dir} {wheel}"

# ============================================================================
# replace pytest.ini
# ============================================================================

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["tests", "src/compas_cra"]
python_files = ["test_*.py", "*_test.py", "test.py"]
addopts = ["-ra", "--strict-markers", "--doctest-glob=*.rst", "--tb=short"]
doctest_optionflags = [
    "NORMALIZE_WHITESPACE",
    "IGNORE_EXCEPTION_DETAIL",
    "ALLOW_UNICODE",
    "ALLOW_BYTES",
    "NUMBER",
]

# ============================================================================
# replace bumpversion.cfg
# ============================================================================

[tool.bumpversion]
current_version = "0.8.0"
message = "Bump version to {new_version}"
commit = true
tag = true

[[tool.bumpversion.files]]
filename = "src/compas_cra/__init__.py"
search = "{current_version}"
replace = "{new_version}"

[[tool.bumpversion.files]]
filename = "CHANGELOG.md"
search = "Unreleased"
replace = "[{new_version}] {now:%Y-%m-%d}"

# ============================================================================
# replace setup.cfg
# ============================================================================

[tool.black]
line-length = 119

[tool.ruff]
line-length = 119
indent-width = 4
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["I001"]
"tests/*" = ["I001"]
"tasks.py" = ["I001"]

[tool.ruff.lint.isort]
force-single-line = true

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.pycodestyle]
max-doc-length = 179

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = "dynamic"
