site_name: COMPAS CRA
site_description: Coupled Rigid-Block Analysis (CRA) for the COMPAS framework
site_url: https://petrasvestartas.github.io/compas_cra/

repo_name: petrasvestartas/compas_cra
repo_url: https://github.com/petrasvestartas/compas_cra/

copyright: Copyright &copy; 2020 - 2026, ETH Zurich - Block Research Group

extra:
  homepage: https://petrasvestartas.github.io/compas_cra/

extra_css:
  - css/extra.css

theme:
  name: material
  palette:
    # Palette toggle for automatic mode
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode

    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: light blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: light blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Roboto
    code: Roboto Mono
  logo: assets/images/compas_icon_white.png
  favicon: public/favicon.ico
  features:
    - content.code.copy
    - content.footnote.tooltips
    - navigation.expand
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - toc.follow

markdown_extensions:
  - abbr
  - attr_list
  - admonition
  - callouts:
      strip_period: no
  - footnotes
  - md_in_html
  - pymdownx.blocks.caption
  - pymdownx.caret
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.superfences
  - toc:
      permalink: "¤"

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [src] # search packages in the src folder
          inventories:
            - https://docs.python.org/3/objects.inv
            - https://compas.dev/compas/latest/objects.inv
          options:
            allow_inspection: true
            backlinks: tree
            docstring_options:
              ignore_init_summary: true
              trim_doctest_flags: true
            docstring_style: numpy
            docstring_section_style: list
            filters: public
            group_by_category: true
            heading_level: 1
            inheritance_diagram_direction: TD
            inherited_members: false
            line_length: 88
            merge_init_into_class: true
            modernize_annotations: true
            parameter_headings: false
            preload_modules: [mkdocstrings, compas]
            relative_crossrefs: true
            scoped_crossrefs: true
            separate_signature: true
            show_bases: false
            show_category_heading: true
            show_docstring_attributes: true
            show_docstring_functions: true
            show_docstring_modules: false
            show_if_no_docstring: false
            show_inheritance_diagram: false
            show_root_heading: true
            show_root_full_path: true
            show_signature: true
            show_signature_annotations: true
            show_signature_type_parameters: true
            show_source: false
            show_submodules: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            signature_crossrefs: true
            summary:
              modules: false
            type_parameter_headings: true
            unwrap_annotated: true

nav:
  - Introduction: index.md
  - Installation: installation.md
  - Tutorial: tutorial.md
  - Examples:
      - examples/index.md
      - Simplest cube: examples/00_simple_cube.md
      - Two cubes with RBE: examples/01_cubes_rbe.md
      - Two cubes: examples/02_cubes.md
      - Two cubes with penalty: examples/03_cubes_penalty.md
      - Stacks: examples/04_stacks.md
      - Wedge: examples/05_wedge.md
      - Arch: examples/06_arch.md
      - Shelf: examples/07_shelf.md
      - Snake: examples/08_snake.md
      - Bridge: examples/09_bridge.md
      - Armadillo: examples/10_armadillo.md
      - Short concave joint: examples/11_concave-short.md
      - Long concave joint: examples/12_concave-long.md
      - Curved three blocks: examples/13_curve-3-blocks.md
      - Short curved cube: examples/14_cube-curve-short.md
      - Tall curved cube: examples/15_cube-curve-tall.md
      - Model HA: examples/16_ha.md
  - Reference:
      - algorithms: reference/compas_cra.algorithms.md
      - datastructures: reference/compas_cra.datastructures.md
      - equilibrium: reference/compas_cra.equilibrium.md
      - geometry: reference/compas_cra.geometry.md
      - viewers: reference/compas_cra.viewers.md
  - Other:
      - knownissues.md
      - contributions.md
      - cite.md
      - changelog.md
      - license.md
